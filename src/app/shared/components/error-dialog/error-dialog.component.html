<h2 mat-dialog-title>{{ data.title || 'Error' }}</h2>
<div mat-dialog-content>
  <div *ngIf="data.status || data.timestamp" class="meta">
    <div *ngIf="data.status">Código: {{ data.status }}</div>
    <div *ngIf="data.timestamp">Fecha: {{ data.timestamp }}</div>
  </div>
  <mat-list role="list">
    <mat-list-item role="listitem" *ngFor="let m of data.messages">{{ m }}</mat-list-item>
  </mat-list>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cerrar</button>
</div>
